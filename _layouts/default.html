<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <style>
      :root {
        --fg: #24292e;
        --muted: #586069;
        --border: #eaecef;
        --accent: #00534b;
        --bg: #fafbfc;
        --card: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
      }
      .container { max-width: 960px; margin: 0 auto; padding: 40px 24px 64px; }
      .content { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 40px 48px; }
      h1, h2, h3 { color: var(--fg); font-weight: 600; }
      h1 { font-size: 2rem; margin: 0 0 8px; }
      h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-top: 40px; }
      h3 { font-size: 1.15rem; margin-top: 24px; }
      a { color: #0366d6; text-decoration: none; }
      a:hover { text-decoration: underline; }
      code { background: #f6f8fa; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
      hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
      table { width: 100%; border-collapse: collapse; margin: 16px 0; }
      th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
      th { background: #f6f8fa; font-weight: 600; }
      img { max-width: 100%; height: auto; }
      blockquote { border-left: 4px solid var(--border); color: var(--muted); margin: 16px 0; padding: 4px 16px; }
      .hero { text-align: center; padding: 8px 0 32px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
      .hero h1 { font-size: 2.2rem; margin-bottom: 12px; border: none; }
      .hero .meta { color: var(--muted); font-size: 0.95rem; margin-bottom: 20px; }
      .hero .badges { margin: 16px 0; }
      .hero .badges img { margin: 2px 3px; vertical-align: middle; }
      .hero .authors { font-weight: 600; margin-top: 20px; color: var(--fg); }
      .footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        {{ content }}
        <div class="footer">
          Source: <a href="https://github.com/thomasscottbeck-sudo/MSBA-Capstone-MasterControl-GroupProject">github.com/thomasscottbeck-sudo/MSBA-Capstone-MasterControl-GroupProject</a>
        </div>
      </div>
    </div>
  </body>
</html>
