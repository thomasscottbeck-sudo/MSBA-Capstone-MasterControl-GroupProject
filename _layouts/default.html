<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      body { background: #fafbfc; }
      .container-lg { max-width: 960px; margin: 0 auto; padding: 40px 24px 64px; }
      .markdown-body { background: transparent; }
      .markdown-body img.shield { display: inline; vertical-align: middle; margin: 2px; }
      .markdown-body h1 { border-bottom: none; padding-bottom: 0; margin-top: 0; font-size: 2rem; }
      .markdown-body h2 { border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; margin-top: 2em; }
      .markdown-body table { display: table; width: 100%; }
      .markdown-body .hero { text-align: center; padding: 24px 0 12px; border-bottom: 1px solid #eaecef; margin-bottom: 32px; }
      .markdown-body .hero h1 { font-size: 2.2rem; margin-bottom: 8px; }
      .markdown-body .hero .meta { color: #586069; font-size: 0.95rem; margin-bottom: 16px; }
      .markdown-body .hero .badges img { margin: 2px 3px; }
      .markdown-body .hero .authors { color: #24292e; font-weight: 600; margin-top: 16px; }
      .site-footer { border-top: 1px solid #eaecef; margin-top: 48px; padding-top: 16px; color: #586069; font-size: 0.85rem; text-align: center; }
    </style>
  </head>
  <body>
    <div class="container-lg markdown-body">
      {{ content }}
      <div class="site-footer">
        Source: <a href="https://github.com/{{ site.github.repository_nwo }}">github.com/{{ site.github.repository_nwo }}</a>
      </div>
    </div>
  </body>
</html>
